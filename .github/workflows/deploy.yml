name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mnemikon-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to server
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Update and rebuild backend
        shell: bash
        run: |
          ssh \
            -F /dev/null \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
            cd /home/andres/proyectos/mnemikon/backend
            git pull --ff-only origin main
            cd /home/andres/proyectos/mnemikon
            docker compose up -d --build backend
            docker compose ps backend'
